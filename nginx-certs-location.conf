# Insert this block inside the existing server { ... } for
# vaultx.internal.ebc.edu.kh. Placement relative to "location /" does
# not change precedence (Nginx picks the longest matching plain-prefix
# location regardless of order), but keep it near the top for
# readability. IMPORTANT: check the existing vhost for any regex
# location (location ~ ... / location ~* ...) that might match /certs/
# first — regex locations take precedence over prefix locations like
# this one.

location /certs/ {
    proxy_pass http://certificate-api:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    limit_except GET {
        deny all;
    }
}

location /internal-certs/ {
    proxy_pass http://certificate-api:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    limit_except GET {
        deny all;
    }
}
